<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Kompaktowy Konwerter Archiwów</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:linear-gradient(135deg,#667eea,#764ba2);font:15px system-ui,sans-serif;color:#243047}.wrap{max-width:960px;margin:20px auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 36px #0003}h1{text-align:center}.panel{padding:16px;border:1px solid #ddd;border-radius:12px;margin:14px 0}button,select,input{font:inherit;padding:9px;border-radius:7px;border:1px solid #ccd2df}button{background:#5546d9;color:white;cursor:pointer}textarea{width:100%;height:180px;font:13px monospace}#files{max-height:260px;overflow:auto;white-space:pre-wrap;background:#f6f7fb;padding:12px}</style></head><body><main class="wrap"><h1>🚀 Super Konwerter Plików</h1><p>Rozpakuj pliki ZIP w przeglądarce i eksportuj zawartość tekstową.</p><section class="panel"><input id="filesInput" type="file" multiple accept=".zip,.json,.js,.txt,.md,.html,.css"><button id="extract">Rozpakuj / wczytaj</button><label>Eksport <select id="format"><option>TXT</option><option>JSON</option><option>HTML</option></select></label><button id="export">Pobierz wynik</button><button id="clear">Wyczyść</button><p id="status">Wybierz archiwum ZIP lub pliki tekstowe. Przetwarzanie lokalne.</p></section><section id="files" class="panel">Brak plików</section><textarea id="preview" placeholder="Podgląd pliku"></textarea></main><script>let result=[];const fi=document.querySelector('#filesInput'),list=document.querySelector('#files');document.querySelector('#extract').onclick=async()=>{result=[];const files=[...fi.files];for(const f of files){if(f.size>200*1024*1024){alert(`${f.name}: limit 200 MB`);continue}if(/\.zip$/i.test(f.name)){if(!window.JSZip){alert('Nie udało się załadować biblioteki ZIP.');return}const zip=await JSZip.loadAsync(f);const jobs=[];zip.forEach((path,item)=>{if(!item.dir&&/\.(txt|json|js|csv|md|html|css|xml|ya?ml)$/i.test(path))jobs.push(item.async('text').then(content=>({name:path,content}))) });result.push(...await Promise.all(jobs))}else result.push({name:f.name,content:await f.text()})}render();document.querySelector('#status').textContent=`Wczytano ${result.length} plików.`};function render(){list.replaceChildren();if(!result.length){list.textContent='Brak plików';return}result.forEach((x,i)=>{const b=document.createElement('button');b.textContent=`${x.name} (${x.content.length} znaków)`;b.style.display='block';b.style.margin='5px';b.onclick=()=>document.querySelector('#preview').value=x.content;list.append(b)})}document.querySelector('#export').onclick=()=>{if(!result.length)return alert('Najpierw wczytaj pliki');const ext=document.querySelector('#format').value;const payload=ext==='JSON'?JSON.stringify({files:result},null,2):ext==='HTML'?`<!doctype html><meta charset="utf-8"><title>Eksport plików</title>${result.map(x=>`<h2>${esc(x.name)}</h2><pre>${esc(x.content)}</pre>`).join('')}`:result.map((x,i)=>`--- PLIK ${i+1}: ${x.name} ---\n${x.content}`).join('\n\n');const blob=new Blob([payload],{type:ext==='JSON'?'application/json':ext==='HTML'?'text/html':'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`export.${ext.toLowerCase()}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelector('#clear').onclick=()=>{result=[];fi.value='';render();document.querySelector('#preview').value='';document.querySelector('#status').textContent='Wyczyszczono.'};</script></body></html>
