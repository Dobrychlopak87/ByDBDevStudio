<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edytor tekstu — DBDevStudio</title><style>*{box-sizing:border-box}body{margin:0;background:#171a21;color:#e8edf2;font:15px system-ui,sans-serif}header{display:flex;gap:8px;align-items:center;padding:12px;background:#222733;flex-wrap:wrap}button,input{font:inherit;padding:8px;border-radius:6px;border:1px solid #495264;background:#171a21;color:inherit}button{cursor:pointer}textarea{display:block;width:100%;height:calc(100vh - 110px);resize:none;background:#111318;color:#e8edf2;border:0;padding:16px;font:14px/1.5 ui-monospace,monospace;tab-size:4}#name{margin-left:auto;color:#aab3c1}#find{width:min(240px,45vw)}</style></head><body><header><button id="open">Otwórz</button><button id="save">Zapisz jako</button><button id="findBtn">Szukaj</button><input id="find" placeholder="Szukaj w tekście" hidden><button id="next" hidden>Następne</button><span id="name">bez-nazwy.txt</span><input id="file" type="file" hidden accept=".txt,.json,.js,.csv,.md,.html,.css"></header><textarea id="editor" spellcheck="false" aria-label="Edytor tekstu"></textarea><script>const e=document.querySelector('#editor'),f=document.querySelector('#file'),n=document.querySelector('#name'),q=document.querySelector('#find');let filename='bez-nazwy.txt';document.querySelector('#open').onclick=()=>f.click();f.onchange=async()=>{if(f.files[0]){filename=f.files[0].name;n.textContent=filename;e.value=await f.files[0].text();f.value=''}};document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([e.value],{type:'text/plain;charset=utf-8'}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.querySelector('#findBtn').onclick=()=>{q.hidden=!q.hidden;document.querySelector('#next').hidden=q.hidden;if(!q.hidden)q.focus()};document.querySelector('#next').onclick=()=>{const t=e.value.toLowerCase(),needle=q.value.toLowerCase();if(!needle)return;let p=t.indexOf(needle,e.selectionEnd);if(p<0)p=t.indexOf(needle);if(p>=0){e.focus();e.setSelectionRange(p,p+needle.length)}};document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='o'){ev.preventDefault();f.click()}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){ev.preventDefault();document.querySelector('#save').click()}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='f'){ev.preventDefault();q.hidden=false;document.querySelector('#next').hidden=false;q.focus()}});</script></body></html>
