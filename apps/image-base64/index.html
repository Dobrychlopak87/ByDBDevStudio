<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konwerter obrazów Base64</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:linear-gradient(135deg,#667eea,#764ba2);font:15px system-ui,sans-serif;color:#283044}.wrap{max-width:760px;margin:5vh auto;background:white;border-radius:18px;padding:26px;box-shadow:0 20px 60px #0004}h1{text-align:center}.drop{padding:28px;border:2px dashed #667eea;text-align:center;border-radius:12px;cursor:pointer}img{display:block;max-width:100%;max-height:300px;margin:20px auto}textarea{width:100%;height:140px;margin:12px 0;padding:12px;font:12px monospace}button,select{padding:10px;border:0;border-radius:8px;background:#667eea;color:white;cursor:pointer;margin:4px}small{color:#667085}</style></head><body><main class="wrap"><h1>🖼️ Konwerter obrazów do Base64</h1><p style="text-align:center">Konwersja wykonywana lokalnie w przeglądarce</p><div class="drop" id="drop">Kliknij lub upuść plik obrazu<input id="file" type="file" accept="image/*" hidden></div><img id="preview" hidden><p id="info"></p><label>Format: <select id="format"><option value="plain">Czysty Base64</option><option value="datauri">Data URI</option><option value="html">HTML &lt;img&gt;</option><option value="css">CSS background</option></select></label><textarea id="out" readonly placeholder="Wynik pojawi się tutaj"></textarea><button id="copy">Kopiuj</button><button id="download">Pobierz .txt</button><button id="reset">Nowy obraz</button></main><script>const input=document.querySelector('#file'),drop=document.querySelector('#drop'),img=document.querySelector('#preview'),out=document.querySelector('#out'),fmt=document.querySelector('#format');let data='',mime='',name='image';drop.onclick=()=>input.click();for(const t of ['dragover','drop'])drop.addEventListener(t,e=>e.preventDefault());drop.ondrop=e=>{if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};input.onchange=()=>input.files[0]&&load(input.files[0]);function load(file){if(!file.type.startsWith('image/'))return alert('Wybierz plik obrazu');name=file.name.replace(/\.[^.]+$/,'');mime=file.type;const r=new FileReader();r.onload=()=>{data=String(r.result).split(',')[1]||'';img.src=r.result;img.hidden=false;const probe=new Image();probe.onload=()=>document.querySelector('#info').textContent=`${file.name} · ${file.type} · ${Math.round(file.size/1024)} KB · ${probe.width}×${probe.height}px · Base64 ${Math.round(data.length/1024)} KB`;probe.src=r.result;render()};r.readAsDataURL(file)}function render(){const uri=`data:${mime};base64,${data}`;out.value=fmt.value==='plain'?data:fmt.value==='datauri'?uri:fmt.value==='html'?`<img src="${uri}" alt="${name}">`:`background-image: url('${uri}');`}fmt.onchange=render;document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(out.value);alert('Skopiowano')};document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out.value],{type:'text/plain'}));a.download=`${name}_base64_${fmt.value}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.querySelector('#reset').onclick=()=>{input.value='';img.hidden=true;img.removeAttribute('src');out.value='';data='';document.querySelector('#info').textContent=''};</script></body></html>
